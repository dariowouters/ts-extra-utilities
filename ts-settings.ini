; ============================================================
;  ts-extra-utilities — configuracao de teclas / keybinds
; ============================================================
;
; PORTUGUES
;
;   Edite este arquivo com o jogo FECHADO.
;
;   Cada linha e uma acao: nome_da_acao=TECLA
;   Use 0 (zero) para deixar uma acao sem bind.
;
;   Somente estes valores sao aceitos:
;     - Letras e numeros:    A-Z, 0-9
;     - Teclas de funcao:    F1 ate F24
;     - INSERT  DELETE  HOME  END  PAGEUP  PAGEDOWN
;     - UP  DOWN  LEFT  RIGHT
;     - SPACE  TAB  ENTER  BACKSPACE  ESCAPE
;     - NUMPAD0 ate NUMPAD9
;     - MINUS  EQUALS  COMMA  PERIOD
;     - ou o codigo numerico da tecla (ex.: 46 = Delete)
;
;   Se voce escrever um valor que o sistema nao aceita, a bind
;   volta para o padrao automaticamente:
;     toggle_ui     -> DELETE   (abre a janela do plugin)
;     toggle_cursor -> INSERT   (libera o cursor do mouse)
;   As duas tambem nao podem ficar iguais entre si — nesse caso
;   voltam ao padrao igualmente. Isso existe para voce nunca
;   ficar sem conseguir abrir o menu do plugin.
;
;   Este arquivo vale de duas formas:
;     1) Ao lado da DLL (pasta "plugins" do jogo): define
;        SEMPRE as teclas toggle_ui e toggle_cursor (elas nao
;        podem ser mudadas dentro do jogo), e serve de padrao
;        das demais binds na primeira vez que o plugin roda.
;     2) Em %APPDATA%\ts-extra-utilities\settings.ini: e o
;        arquivo pessoal do usuario, criado e atualizado quando
;        ele remapeia teclas dentro do jogo — para as demais
;        acoes, esse arquivo e o que vale.
;
; ------------------------------------------------------------
;
; ENGLISH
;
;   Edit this file while the game is CLOSED.
;
;   Each line is an action: action_name=KEY
;   Use 0 (zero) to leave an action unbound.
;
;   Only these values are accepted:
;     - Letters and digits:  A-Z, 0-9
;     - Function keys:       F1 to F24
;     - INSERT  DELETE  HOME  END  PAGEUP  PAGEDOWN
;     - UP  DOWN  LEFT  RIGHT
;     - SPACE  TAB  ENTER  BACKSPACE  ESCAPE
;     - NUMPAD0 to NUMPAD9
;     - MINUS  EQUALS  COMMA  PERIOD
;     - or the numeric virtual-key code (e.g. 46 = Delete)
;
;   If you write a value the system does not accept, the bind
;   falls back to the default automatically:
;     toggle_ui     -> DELETE   (opens the plugin window)
;     toggle_cursor -> INSERT   (releases the mouse cursor)
;   The two may not be equal either — if they are, both fall
;   back to the defaults. This exists so you can never lock
;   yourself out of the plugin menu.
;
;   This file works in two places:
;     1) Next to the DLL (the game's "plugins" folder): it
;        ALWAYS sets toggle_ui and toggle_cursor (they cannot
;        be changed in-game), and seeds the other binds the
;        first time the plugin runs.
;     2) %APPDATA%\ts-extra-utilities\settings.ini: the user's
;        own file, created and updated when they rebind keys
;        in-game — it governs all the other actions.
;
; ============================================================

[keybinds]
toggle_ui=DELETE
toggle_cursor=INSERT
steer_left=LEFT
steer_right=RIGHT
steer_center=DOWN
toggle_steering_lock=UP
; Numeração / numbering:
;   A janela do plugin mostra "Trailer 0" (do jogo, tecla T),
;   "Trailer 1" (dolly/meio) e "Trailer 2" (traseira).
;   attach_detach_2 / attach_truck_2 agem no "Trailer 1" da janela.
;   attach_detach_3 / attach_truck_3 agem no "Trailer 2" da janela.
;   (os nomes das chaves ficam assim para não quebrar arquivos salvos)
attach_detach_2=0
attach_detach_3=0
attach_truck_2=0
attach_truck_3=0

[steering]
; velocidade do giro do eixo direcional (0.1 a 2.0)
; steerable-axle turn speed (0.1 to 2.0)
speed=0.5
